<section class="band band--tight">
  <div class="shell">
    <p class="eyebrow">Connect</p>
    <h1>Contact Us</h1>
    <p class="lede">The Medici Museum of Art welcomes your feedback and questions.</p>
  </div>
</section>

<section class="band band--tight">
  <div class="shell split">
    <div>
      <h2 id="reach-us">Reach us directly</h2>
      {{contactPhoneEmail}}
    </div>

    <div>
      <h2 id="contact-form">Send us a message</h2>
      {{formNotice}}
      <p>Fields marked <span class="req">*</span> are required.</p>

      <form class="form" data-validate method="post" action="{{formAction}}"
            data-sent="Thank you. Your message has been sent, and we will reply by email.">
        {{formFields}}
        <input type="hidden" name="subject" value="New message from the museum website">
        <p class="form__status" role="alert" data-form-status></p>

        <fieldset>
          <legend>Your details</legend>
          <div class="form-row">
            <div class="field">
              <label for="c-first">First name <span class="req" aria-hidden="true">*</span></label>
              <input id="c-first" name="firstName" type="text" autocomplete="given-name" required
                     aria-describedby="c-first-error">
              <p class="field__error" id="c-first-error"></p>
            </div>
            <div class="field">
              <label for="c-last">Last name <span class="req" aria-hidden="true">*</span></label>
              <input id="c-last" name="lastName" type="text" autocomplete="family-name" required
                     aria-describedby="c-last-error">
              <p class="field__error" id="c-last-error"></p>
            </div>
          </div>

          <div class="field" style="margin-top:1.35rem">
            <label for="c-email">Email <span class="req" aria-hidden="true">*</span></label>
            <input id="c-email" name="email" type="email" autocomplete="email" required
                   aria-describedby="c-email-hint c-email-error">
            <p class="hint" id="c-email-hint">So we can reply. We do not share it.</p>
            <p class="field__error" id="c-email-error"></p>
          </div>
        </fieldset>

        <fieldset>
          <legend>Your message</legend>
          <div class="field">
            <label for="c-subject">Subject <span class="req" aria-hidden="true">*</span></label>
            <input id="c-subject" name="messageSubject" type="text" required aria-describedby="c-subject-error">
            <p class="field__error" id="c-subject-error"></p>
          </div>

          <div class="field" style="margin-top:1.35rem">
            <label for="c-message">Message <span class="req" aria-hidden="true">*</span></label>
            <textarea id="c-message" name="message" required aria-describedby="c-message-error"></textarea>
            <p class="field__error" id="c-message-error"></p>
          </div>

          <div class="checkbox" style="margin-top:1.35rem">
            <input id="c-news" name="newsletter" type="checkbox">
            <label for="c-news">Sign me up for news and updates</label>
          </div>
        </fieldset>

        <div>
          <button class="btn" type="submit">Send message</button>
        </div>
      </form>
    </div>
  </div>
</section>
